name: Tests

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
        include:
          - os: windows-latest
            php: '8.2'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test -- --log-junit junit.xml

      # Surface failing tests as annotations on the run and on pull requests.
      - name: Annotate failures
        if: failure()
        shell: php {0}
        run: |
          <?php
          $xml = @simplexml_load_file('junit.xml');
          if (!$xml) exit;
          foreach ($xml->xpath('//testcase[failure or error]') as $case) {
             $node = $case->failure ?: $case->error;
             $msg = str_replace(['%', "\r", "\n"], ['%25', '%0D', '%0A'], substr((string) $node, 0, 3000));
             echo "::error title={$case['class']}::{$case['name']}%0A{$msg}\n";
          }
